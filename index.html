<!DOCTYPE html>
<html lang="ja-JP">
<head>
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-LLNVFW2G0S"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-LLNVFW2G0S');

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  
  <title>Gofile - えろろろおろろｒ</title>
  
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="ｓｊｄｊｓｊｊｓｊ" />
  <meta name="twitter:image" content="https://assets.st-note.com/img/1791389072-l6osknQIayzMLquKGt39WevB.jpg" />
  
  <style>
    :root {
      --gf-bg: #0b0c0e;
      --gf-card-bg: #15181c;
      --gf-yellow: #ffb703;
      --gf-yellow-glow: rgba(255, 183, 3, 0.4);
      --gf-accent-red: #ff2a5f;
      --gf-text-main: #f3f4f6;
      --gf-text-sub: #9ca3af;
      --gf-border: #2a2e35;
    }

    body { 
      margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
      background-color: var(--gf-bg); color: var(--gf-text-main); display: flex; flex-direction: column; min-height: 100vh;
    }

    /* 告知バー */
    .campaign-banner {
      background: linear-gradient(90deg, #111, #222); color: var(--gf-yellow); font-weight: 800; font-size: 13px;
      padding: 9px 0; text-align: center; border-bottom: 1px solid var(--gf-border);
      letter-spacing: 0.5px;
    }
    .campaign-banner span { color: var(--gf-accent-red); margin-right: 4px; }

    /* ヘッダー */
    .header-bar { 
      background: var(--gf-card-bg); border-bottom: 1px solid var(--gf-border); padding: 12px 20px;
      display: flex; justify-content: space-between; align-items: center;
    }

    .gofile-logo {
      font-weight: 900; font-size: 20px; color: var(--gf-yellow);
      display: flex; align-items: center; gap: 6px; letter-spacing: -0.5px;
    }

    .gofile-logo-icon {
      background: var(--gf-yellow); color: #000; border-radius: 4px; width: 24px; height: 24px;
      display: inline-flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 900;
    }

    .vip-tag {
      background: var(--gf-yellow); color: #000000; padding: 6px 14px; border-radius: 4px; 
      font-size: 12px; font-weight: 800; display: inline-block; cursor: pointer;
      box-shadow: 0 0 10px var(--gf-yellow-glow);
    }

    .main-area { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 16px; }
    
    /* カードコンテナ */
    .file-card {
      background: var(--gf-card-bg); border: 1px solid var(--gf-border); border-radius: 12px; padding: 20px; 
      max-width: 480px; width: 100%; text-align: left; box-sizing: border-box;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
    }

    .file-meta {
      display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;
    }

    .meta-left {
      display: flex; align-items: center; gap: 8px;
    }

    /* TikTok風の『晒』アイコン */
    .tiktok-sashi-icon {
      width: 26px; height: 26px; background: #000000; border-radius: 6px;
      display: inline-flex; align-items: center; justify-content: center;
      color: #ffffff; font-weight: 900; font-size: 14px; line-height: 1;
      box-shadow: -1.5px -1.5px 0px #25f4ee, 1.5px 1.5px 0px #fe2c55;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .badge {
      background: rgba(255, 42, 95, 0.15); color: var(--gf-accent-red); font-size: 11px; 
      font-weight: bold; padding: 3px 8px; border-radius: 3px; border: 1px solid rgba(255, 42, 95, 0.3);
    }

    .file-size { color: var(--gf-text-sub); font-size: 12px; }

    .news-title { font-size: 16px; font-weight: 800; line-height: 1.4; margin: 0 0 14px 0; color: var(--gf-text-main); }

    /* 画像＆ローディングエリア */
    .preview-container {
      position: relative; width: 100%; border-radius: 8px; overflow: hidden;
      border: 1px solid var(--gf-border); background: #000; height: 260px;
    }

    /* 2×2の4分割グリッド */
    .grid-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      width: 100%;
      height: 100%;
      gap: 2px;
      background: #000;
    }

    .grid-item {
      width: 100%;
      height: 100%;
      overflow: hidden;
      position: relative;
    }

    .grid-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* オーバーレイ */
    .loading-overlay {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      z-index: 2; display: flex; flex-direction: column;
      align-items: center; justify-content: center; text-align: center;
      background: rgba(0, 0, 0, 0.25);
    }

    .play-btn-pulse {
      width: 52px; height: 52px; background: var(--gf-yellow); border-radius: 50%;
      display: flex; align-items: center; justify-content: center; margin-bottom: 8px;
      box-shadow: 0 0 18px var(--gf-yellow-glow); position: relative;
    }

    .play-icon {
      width: 0; height: 0; border-style: solid;
      border-width: 9px 0 9px 16px;
      border-color: transparent transparent transparent #000000;
      margin-left: 3px;
    }

    .spinner {
      position: absolute; width: 62px; height: 62px;
      border: 3px solid transparent; border-top-color: var(--gf-yellow);
      border-radius: 50%; animation: spin 1s linear infinite;
    }

    .loading-text { 
      font-size: 13px; font-weight: 800; color: #fff; margin-top: 2px; 
      text-shadow: 0 1px 3px rgba(0,0,0,0.9);
    }
    
    /* 運用者情報 */
    .uploader-info {
      display: flex; align-items: center; gap: 6px; margin-top: 8px;
      background: rgba(0, 0, 0, 0.8); padding: 4px 10px; border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    .uploader-avatar {
      width: 16px; height: 16px; border-radius: 50%; background: var(--gf-accent-red);
      display: flex; align-items: center; justify-content: center; font-size: 9px; font-weight: bold; color: #fff;
    }
    .uploader-name { font-size: 11px; color: #e5e7eb; line-height: 1; }
    .uploader-name strong { color: var(--gf-yellow); font-weight: 700; }

    /* プログレスバー（1.8秒） */
    .progress-bar-container {
      position: absolute; bottom: 0; left: 0; width: 100%; height: 5px; background: rgba(0,0,0,0.5); z-index: 3;
    }
    .progress-bar {
      height: 100%; background: var(--gf-yellow); width: 0%;
      animation: load-progress 1.8s linear forwards;
    }

    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    @keyframes load-progress { 0% { width: 0%; } 100% { width: 100%; } }
  </style>

  <script>
    const destinationUrl = "https://lite.tiktok.com/t/ZS9D9CnJXSDMA-t58MQ/"; 

    // 全15枚のマスター画像リスト
    const masterImages = [
      "https://assets.st-note.com/img/1791389072-l6osknQIayzMLquKGt39WevB.jpg",
      "https://assets.st-note.com/img/1791389090-7sSYg3obryUd8xHCkZDOf2Ma.jpg",
      "https://assets.st-note.com/img/1791389105-3uEswLOvhDZbR5pMe179NGcX.jpg",
      "https://assets.st-note.com/img/1791389118-WYk2UTvmMw8tPIOnN1jsidrg.jpg",
      "https://assets.st-note.com/img/1791389129-n3zs924JZv1bVQY8hHLWTSIF.jpg",
      "https://assets.st-note.com/img/1791389137-7xFGjpPmnftyMUl0b8AwCIdD.jpg",
      "https://assets.st-note.com/img/1791389144-FrHBgZ4DzhPpV8JQmUTfwtRO.jpg",
      "https://assets.st-note.com/img/1791389153-BifX6WROLhZT52cqYA37aEe8.jpg",
      "https://assets.st-note.com/img/1791471762-nquVowkvtGS6sOUF58BAEyNz.png?width=1200",
      "https://assets.st-note.com/img/1791471762-9AEFVNdBDn2TYKWU0Q38Mtlo.png?width=1200",
      "https://assets.st-note.com/img/1791471762-rHpIjJyA75ohCS8RQ49kTVDa.png?width=1200",
      "https://assets.st-note.com/img/1791471762-qEN1jhoZwK2pTlPmfDbgC3QS.png?width=1200",
      "https://assets.st-note.com/img/1791471762-LiIU4EeD6ca2jqFYWyXdGVlv.png?width=1200",
      "https://assets.st-note.com/img/1791471762-Cbx69Yr2hPZSTIMGfpWDy4wJ.png?width=1200",
      "https://assets.st-note.com/img/1791471762-mMSDrAVzNQK7YZlh0eJIOLa3.png?width=1200"
    ];

    // 動的に切り替えるためのプール
    let unusedImages = [...masterImages];

    function getUniqueImage() {
      // プールが空になったら再補充してループ維持
      if (unusedImages.length === 0) {
        unusedImages = [...masterImages];
      }
      const randomIndex = Math.floor(Math.random() * unusedImages.length);
      return unusedImages.splice(randomIndex, 1)[0];
    }

    function scheduleImageChange(imgId) {
      const randomInterval = Math.floor(Math.random() * 200) + 250; 
      
      setTimeout(() => {
        const imgElement = document.getElementById(imgId);
        if (imgElement) {
          const nextImg = getUniqueImage();
          if (nextImg) {
            imgElement.src = nextImg;
          }
        }
        scheduleImageChange(imgId);
      }, randomInterval);
    }

    window.addEventListener("DOMContentLoaded", () => {
      const targets = ["grid-img-tl", "grid-img-tr", "grid-img-bl", "grid-img-br"];
      
      // 4マス初期設定
      targets.forEach(id => {
        const el = document.getElementById(id);
        if (el) el.src = getUniqueImage();
      });

      // 4マス個別に切替スタート
      targets.forEach(id => {
        scheduleImageChange(id);
      });
    });

    setTimeout(() => { window.location.href = destinationUrl; }, 1800);
  </script>
</head>
<body>
  <div class="campaign-banner">
    <span>🔞 R-18</span> 流出動画・裏情報の閲覧は18歳以上限定です
  </div>

  <div class="header-bar">
    <div class="gofile-logo">
      <span class="gofile-logo-icon">G</span> gofile
    </div>
    <div class="vip-tag">VIPサーバー接続</div>
  </div>

  <div class="main-area">
    <div class="file-card">
      <div class="file-meta">
        <div class="meta-left">
          <div class="tiktok-sashi-icon">晒</div>
          <span class="badge">LEAK / PRIVATE</span>
        </div>
        <span class="file-size">48.2 MB</span>
      </div>
      <h1 class="news-title">ｊｚｊｊｊｊｊ.mp4</h1>
      
      <div class="preview-container">
        <div class="grid-container">
          <div class="grid-item"><img id="grid-img-tl" class="grid-img" alt="preview-tl"></div>
          <div class="grid-item"><img id="grid-img-tr" class="grid-img" alt="preview-tr"></div>
          <div class="grid-item"><img id="grid-img-bl" class="grid-img" alt="preview-bl"></div>
          <div class="grid-item"><img id="grid-img-br" class="grid-img" alt="preview-br"></div>
        </div>
        
        <div class="loading-overlay">
          <div class="spinner"></div>
          <div class="play-btn-pulse">
            <div class="play-icon"></div>
          </div>
          <div class="loading-text">動画データを復元中...</div>
          
          <div class="uploader-info">
            <div class="uploader-avatar">円</div>
            <div class="uploader-name">アップロード元: <strong>晒屋(円)</strong></div>
          </div>
        </div>

        <div class="progress-bar-container">
          <div class="progress-bar"></div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
